name: contents-db-checks
run-name: Portfolio's Contents-db package checks
on:
  pull_request:
    branches:
      - main
    paths:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - '.github/workflows/contents-db-checks.yml'
      - 'packages/contents-db/**'

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      WRANGLER_SEND_METRICS: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          runtime: node@26.8.1
          install: false
          cache: true

      - name: Instal dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Run Typescript checks
        run: |
          pnpm --filter contents-db ts:check
      
      - name: Run integration tests
        run: |
          pnpm --filter contents-db test
