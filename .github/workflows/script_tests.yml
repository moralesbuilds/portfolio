name: script-tests
run-name: Moralesbuilds Portfolio's script tests
on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/**'

jobs:
  python-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Set up python
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Run tests
        run: uv run --with "pytest, pytest-mock" pytest
