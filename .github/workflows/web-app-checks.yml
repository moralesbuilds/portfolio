name: web-app-checks
run-name: Portfolio's Web app checks
on:
  pull_request:
    branches:
      - main
    paths:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - '.github/workflows/web-app-checks.yml'
      - 'apps/web/**'

jobs:
  test-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    env:
      WRANGLER_SEND_METRICS: false
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          runtime: node@26.8.1
          install: false
          cache: true

      - name: Instal dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Build OpenNext worker
        run: |
          pnpm --filter web exec opennextjs-cloudflare build

      - name: Measure bundle compressed size
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm --filter web size > report.md

      - name: Reporting dry-run execution
        if: always()
        run: |
          gh pr comment "${PR_NUMBER:?Missing PR_NUMBER}" --body-file report.md --edit-last --create-if-none
