services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: web
      args:
        - USER_ID=${UID:-1000}
        - GROUP_ID=${GID:-1000}
    ports:
      - "8787:8787"
    volumes:
      - ./apps/web:/app/apps/web
      - global_deps:/app/node_modules
      - web_deps:/app/apps/web/node_modules
    environment:
      - UID=${UID:-1000}
      - GID=${GID:-1000}
      - NODE_ENV=development

volumes:
  global_deps:
  web_deps:
