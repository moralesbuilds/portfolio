services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: web
      args:
        - USER_ID=${UID:-1000}
        - GROUP_ID=${GID:-1000}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - global_deps:/app/node_modules
      - web_deps:/app/apps/web/node_modules
      - web_next:/app/apps/web/.next
    environment:
      - UID=${UID:-1000}
      - GID=${GID:-1000}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}

volumes:
  global_deps:
  web_deps:
  web_next:
